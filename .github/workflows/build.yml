name: Gerar apps (Windows e Android)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: App de PC (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: FreedomFiscal-Windows
          path: release/*.exe

  android:
    name: App de celular (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Conferir Android SDK (já vem na máquina do GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: Ícone e tela de abertura com o logo Freedom
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#eef2f7' --splashBackgroundColorDark '#0b0d12'
      - run: npx cap sync android
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk FreedomFiscal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FreedomFiscal-Android
          path: FreedomFiscal.apk

  release:
    name: Publicar versão
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            arquivos/FreedomFiscal-Windows/*.exe
            arquivos/FreedomFiscal-Android/FreedomFiscal.apk
